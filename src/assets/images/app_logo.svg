<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Shield Shape / Outer Glow -->
  <path d="M 60 22 C 78 22 88 28 88 44 C 88 68 60 88 60 88 C 60 88 32 68 32 44 C 32 28 42 22 60 22 Z" fill="url(#shieldGrad)" opacity="0.18" />

  <!-- Contract Document -->
  <g filter="url(#shadow)">
    <!-- Document background with fold -->
    <path d="M 40 32 L 70 32 L 80 42 L 80 86 C 80 88.2 78.2 90 76 90 L 40 90 C 37.8 90 36 88.2 36 86 L 36 36 C 36 33.8 37.8 32 40 32 Z" fill="url(#docGrad)" />
    
    <!-- Folded corner -->
    <path d="M 70 32 L 80 42 L 70 42 Z" fill="#CBD5E1" />

    <!-- Document text lines -->
    <rect x="44" y="46" width="22" height="3" rx="1.5" fill="#4F46E5" />
    <rect x="44" y="53" width="28" height="2.5" rx="1.25" fill="#94A3B8" />
    <rect x="44" y="59" width="24" height="2.5" rx="1.25" fill="#94A3B8" />
    <rect x="44" y="65" width="26" height="2.5" rx="1.25" fill="#94A3B8" />
    <rect x="44" y="71" width="16" height="2.5" rx="1.25" fill="#94A3B8" />
  </g>

  <!-- Verified / AI Badge with Checkmark -->
  <g filter="url(#shadow)">
    <circle cx="76" cy="76" r="16" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Checkmark icon -->
    <path d="M 70 76 L 74.5 80.5 L 82.5 71.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent in top corner -->
  <path d="M 88 24 Q 92 28 96 28 Q 92 28 88 32 Q 88 28 84 28 Q 88 28 88 24 Z" fill="#FCD34D" opacity="0.9" />
</svg>
